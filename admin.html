<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن | سوق الكيلاني</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --subtext-color: #64748b;
      --border-color: #e2e8f0;
      --success-color: #16a34a;
      --danger-color: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 2rem 1rem; }
    .admin-container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: var(--shadow); }
    h2 { color: var(--primary-color); margin-bottom: 0.5rem; text-align: center; }
    p.subtitle { color: var(--subtext-color); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.2rem; text-align: right; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 0.4rem; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; outline: none; font-size: 0.95rem;
    }
    .form-row { display: flex; gap: 1rem; }
    .form-row .form-group { flex: 1; }
    .btn {
      padding: 0.9rem; border-radius: 10px; border: none; background: var(--primary-color); color: white;
      font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .products-list-section { margin-top: 2.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem; }
    .admin-product-item {
      display: flex; justify-content: space-between; align-items: center; background: #f1f5f9;
      padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 0.8rem; font-size: 0.9rem; gap: 10px;
    }
    .admin-prod-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
    .btn-delete { background: var(--danger-color); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="admin-container">
    <h2>لوحة تحكم الأدمن (سوق الكيلاني)</h2>
    <p class="subtitle">أضف المنتجات بالصورة والسعر لتظهر فوراً للزبائن</p>

    <div class="form-group">
      <label>اسم المتجر / البائع</label>
      <input type="text" id="admin-vendor-name" value="سوق الكيلاني الرئيسي" placeholder="اسم المتجر">
    </div>

    <div class="form-group">
      <label>اسم المنتج</label>
      <input type="text" id="admin-prod-name" placeholder="مثال: بلايستيشن 5 أصلي">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>السعر (ج.م)</label>
        <input type="number" id="admin-prod-price" placeholder="25000">
      </div>
      <div class="form-group">
        <label>الكمية المتاحة</label>
        <input type="number" id="admin-prod-stock" placeholder="5">
      </div>
    </div>

    <div class="form-group">
      <label>رابط صورة المنتج (URL)</label>
      <input type="text" id="admin-prod-img" placeholder="ضع رابط الصورة هنا (اختياري)">
    </div>

    <div class="form-group">
      <label>الوصف وتفاصيل المنتج</label>
      <textarea id="admin-prod-desc" rows="3" placeholder="اكتب وصف المنتج والضمان..."></textarea>
    </div>

    <button class="btn" onclick="addNewProductByAdmin()">نشر المنتج فوراً في الموقع</button>

    <div class="products-list-section">
      <h3>المنتجات المضافة حالياً</h3>
      <div id="admin-products-container" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script>
    const badWordsList = ["غش", "نصب", "حرامي", "احتيال", "كاذب", "زبالة", "سيء جدا", "كلب", "حمار"];

    function filterBadWords(text) {
      let cleanedText = text;
      badWordsList.forEach(word => {
        const regex = new RegExp(word, "gi");
        cleanedText = cleanedText.replace(regex, "***");
      });
      return cleanedText;
    }

    let adminProducts = JSON.parse(localStorage.getItem('kilany_products')) || [
      { id: 1, vendorName: "سوق الكيلاني الرئيسي", name: "سماعة بلوتوث أصلية", price: 350, stock: 15, desc: "سماعة صوت مجسم عالية الدقة مع بطارية تدوم 24 ساعة.", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" }
    ];

    function renderAdminProducts() {
      const container = document.getElementById('admin-products-container');
      container.innerHTML = '';
      if (adminProducts.length === 0) {
        container.innerHTML = `<p style="color:var(--subtext-color); text-align:center;">لا توجد منتجات مضافة.</p>`;
        return;
      }
      adminProducts.forEach((p, index) => {
        container.innerHTML += `
          <div class="admin-product-item">
            <div style="display: flex; align-items: center; gap: 10px;">
              <img src="${p.img || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300'}" class="admin-prod-thumb">
              <div>
                <strong>${p.name}</strong> - <span style="color:var(--primary-color);">${p.price} ج.م</span> (الكمية: ${p.stock})
              </div>
            </div>
            <button class="btn-delete" onclick="deleteProduct(${index})">حذف</button>
          </div>
        `;
      });
    }

    function addNewProductByAdmin() {
      let vendorName = document.getElementById('admin-vendor-name').value.trim() || "سوق الكيلاني الرئيسي";
      let name = document.getElementById('admin-prod-name').value.trim();
      const price = document.getElementById('admin-prod-price').value;
      const stock = document.getElementById('admin-prod-stock').value || 1;
      let img = document.getElementById('admin-prod-img').value.trim();
      let desc = document.getElementById('admin-prod-desc').value.trim();

      if (!name || !price) {
        alert("يرجى كتابة اسم المنتج والسعر على الأقل.");
        return;
      }

      // فلترة الألفاظ السيئة
      name = filterBadWords(name);
      desc = filterBadWords(desc);
      vendorName = filterBadWords(vendorName);

      const defaultImg = "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300";

      const newProd = {
        id: Date.now(),
        vendorName: vendorName,
        name: name,
        price: parseFloat(price),
        stock: parseInt(stock),
        img: img || defaultImg,
        desc: desc || "لا يوجد وصف إضافي."
      };

      adminProducts.push(newProd);
      localStorage.setItem('kilany_products', JSON.stringify(adminProducts));

      // تفريغ الحقول
      document.getElementById('admin-prod-name').value = '';
      document.getElementById('admin-prod-price').value = '';
      document.getElementById('admin-prod-stock').value = '';
      document.getElementById('admin-prod-img').value = '';
      document.getElementById('admin-prod-desc').value = '';

      renderAdminProducts();
      alert("تم نشر المنتج مع صورته بنجاح وأصبح متاحاً للزبائن في الموقع الرئيسي!");
    }

    function deleteProduct(index) {
      if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
        adminProducts.splice(index, 1);
        localStorage.setItem('kilany_products', JSON.stringify(adminProducts));
        renderAdminProducts();
      }
    }

    renderAdminProducts();
  </script>
</body>
</html>
